# /nginx/nginx.conf
#
# This file is mounted directly as the container's /etc/nginx/nginx.conf
# (see docker-compose.yml `nginx` service) -- there is no conf.d include, so
# the plain-HTTP (port 80) and TLS (port 443) server blocks both live in this
# one file rather than a separate drop-in. Keep it that way unless the
# compose mount changes too.
#
# --- ONE-TIME SETUP BEFORE THIS FILE WORKS ---
# 1. Replace every "REPLACE_ME_DOMAIN" below with your real domain, e.g.:
#      sed -i '' 's/REPLACE_ME_DOMAIN/example.com/g' nginx/nginx.conf   # macOS
#      sed -i 's/REPLACE_ME_DOMAIN/example.com/g' nginx/nginx.conf      # Linux
# 2. Run scripts/init-letsencrypt.sh <domain> <email> to obtain the
#    certificate (it also starts nginx as part of the bootstrap).
# See docs/PRODUCTION.md section 2 for the full walkthrough.
#
# Until step 2 has run, nginx will refuse to start against this file --
# `ssl_certificate` below points at a file Let's Encrypt hasn't written yet.
# That's expected; scripts/init-letsencrypt.sh handles the bootstrap
# ordering (dummy cert -> start nginx -> real cert -> reload) precisely so
# an operator never has to hand-run nginx with a half-working config.

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ------------------------------------------------------------------
    # Port 80: ACME HTTP-01 challenge (for cert issuance + renewal), and a
    # 301 redirect to HTTPS for everything else. Let's Encrypt always
    # validates HTTP-01 on the standard port 80, so this block -- and the
    # docker-compose "80:80" mapping -- must stay reachable at the domain's
    # real port 80, not remapped.
    # ------------------------------------------------------------------
    server {
        listen 80;
        server_name REPLACE_ME_DOMAIN;

        # certbot (webroot plugin) writes challenge tokens here; nginx must
        # serve them over plain HTTP. Do NOT redirect this location.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------
    # Port 443: TLS termination, then the same app proxy that used to be
    # the entire config before TLS existed.
    # ------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name REPLACE_ME_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/REPLACE_ME_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/REPLACE_ME_DOMAIN/privkey.pem;

        # Modern TLS only (Mozilla "Intermediate" profile: TLS 1.2 + 1.3,
        # ECDHE-only AEAD ciphers). No DHE/CBC/RC4/3DES.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling -- lets the client skip its own OCSP round-trip.
        # Requires outbound network access to Let's Encrypt's OCSP
        # responder; if a deployment has no outbound access (unlikely),
        # delete these four lines rather than let nginx fail to start.
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/letsencrypt/live/REPLACE_ME_DOMAIN/chain.pem;
        resolver 127.0.0.11 valid=300s; # Docker's embedded DNS resolver
        resolver_timeout 5s;

        # NO Strict-Transport-Security header here on purpose. The app
        # already sends HSTS (app/next.config.js `headers()`,
        # max-age=31536000; includeSubDomains, deliberately without
        # `preload` until the domain is committed to HTTPS-forever).
        # Setting it again here would either duplicate an identical header
        # or silently drift out of sync if one side changes and not the
        # other. If HSTS `preload` submission is ever desired, add it in
        # next.config.js -- keep a single source of truth for this header.

        # ** THE DEFINITIVE FIX ** (carried over from the pre-TLS config)
        # 1. Allow larger file uploads (e.g., 50MB)
        client_max_body_size 300m;

        # 2. Increase timeouts to prevent gateway errors on long-running imports
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        location / {
            proxy_pass http://app:3000; # Assumes your Next.js app container is named 'app'
            proxy_http_version 1.1;
            # No WebSockets in prod -- strip any client-provided Upgrade/
            # Connection to block H2C smuggling (Semgrep
            # possible-nginx-h2c-smuggling). If WebSocket support is ever
            # needed, set these via a `map` that only passes through
            # Upgrade: websocket.
            proxy_set_header Upgrade "";
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
