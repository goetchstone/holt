# /nginx/nginx-host.conf
#
# The host's own way in to the app: a second, small nginx (the `nginx-host`
# service in docker-compose.yml), published on the server's loopback only as
# 127.0.0.1:8080 -- never reachable from another machine.
#
# The app has no host port (there may be several app processes and no single
# one to publish), so the jobs that run on the host itself come here:
# scripts/_cron-run.sh (the automations tick, every 5 minutes), scripts/deploy.sh's
# health gate, scripts/restore-db.sh and scripts/go-live-check.sh. Plain HTTP and
# no redirect, because these clients are on the same machine and do not speak to
# the public name; long timeouts, because the automations tick runs due jobs,
# imports included, inside one request.
#
# Its own nginx, not a server block in nginx.conf, so that it does not depend on
# the public server: nginx.conf loads a TLS certificate, and nginx refuses to
# start at all when one is missing (before scripts/init-letsencrypt.sh has run,
# or on a server reached through a tunnel that has none). In one process that
# took the cron, the deploy's health gate and the restore check down with the
# site. This file needs no certificate and no domain, and nobody edits it.
#
# Anything that reaches this port is treated like any other request: the
# automation routes still require their bearer key, and every other route its
# own sign-in. The loopback binding is what keeps it off the network. Do not
# point a tunnel or a port forward at it.

user nginx;
worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format holt '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log holt;

    include /etc/nginx/app-upstream.conf;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 300m;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        send_timeout          3600s;

        location / {
            proxy_pass http://holt_app;
            proxy_http_version 1.1;
            # Same smuggling guard as the public server (nginx.conf).
            proxy_set_header Upgrade "";
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
