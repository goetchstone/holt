# /nginx/app-upstream.conf
#
# The app processes, for both nginx servers: the public one (nginx.conf) and the
# host's own (nginx-host.conf). Included inside each one's `http {}` block, and
# mounted beside it by docker-compose.yml. One file, so the two cannot drift.

# Docker's embedded DNS. `valid=10s` is how often nginx asks again which
# containers answer to "app", so a process added or replaced by
# `docker compose up` (APP_REPLICAS, a deploy) starts getting requests within
# ten seconds, and one that went away stops getting them. nginx.conf's OCSP
# stapling uses it too.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Every app process. Requests go to each in turn (round robin). They share
# nothing in memory that a request depends on -- sessions are signed cookies,
# state is in Postgres -- so any process can answer any request.
#
# `resolve` makes nginx follow the name as it changes. Without it, nginx looked
# "app" up once when it started and sent everything to the address(es) it got
# then: a process added later got no requests, and one recreated at a new
# address got requests nobody answered. Needs the shared memory `zone`, and
# open-source nginx 1.27.3 or later (the image tag in docker-compose.yml).
#
# A request that could not be delivered to a process (connection refused while
# it restarts) is tried on the next one. One that was delivered is retried
# elsewhere only when it is safe to send twice -- never a POST.
upstream holt_app {
    zone holt_app 64k;
    server app:3000 resolve;
}
