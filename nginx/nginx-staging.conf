# /nginx/nginx-staging.conf
#
# Intentionally HTTP-only, unlike nginx/nginx.conf. Staging (profile
# "staging", host port 8081) is an internal pre-prod environment -- it isn't
# meant to be reachable at a public domain, so there is no hostname for
# Let's Encrypt to issue a cert against and no ACME HTTP-01 challenge can be
# completed. If staging ever needs to be internet-facing (e.g. a client UAT
# environment with real traffic), give it the same treatment as
# nginx/nginx.conf: its own domain, its own
# scripts/init-letsencrypt.sh run (cert paths are per-domain, so staging and
# prod certs don't collide), and a 443 port mapping on the nginx-staging
# service in docker-compose.yml.

user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 300m;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        location / {
            proxy_pass http://app-staging:3000;
            proxy_http_version 1.1;
            # No WebSockets in staging -- strip Upgrade/Connection to
            # block H2C smuggling (Semgrep possible-nginx-h2c-smuggling).
            proxy_set_header Upgrade "";
            proxy_set_header Connection "close";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
