# app/osv-scanner.toml
#
# Suppressions for known-false-positives. Each entry documents why the
# CVE does not apply to this install. Reviewed weekly; any suppression
# with an ignoreUntil date past today should be re-evaluated.
#
# This file sits beside app/package-lock.json, not at the repo root, because
# osv-scanner looks for its config in the directory of the lockfile it scans.
# CI and `npm run security:deps` pass --config explicitly, but the OpenSSF
# Scorecard Vulnerabilities check does not: from the root it ignored every
# entry and counted all five as open (score 5); from here it reads them
# (score 10). Measured 2026-10-15 with scorecard v5.6.0 --local.

# xlsx CVEs below are scanner false positives: osv-scanner matches by
# name+version ("xlsx@0.20.3"), but package.json installs xlsx directly
# from SheetJS's patched CDN tarball
#   https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
# The CDN tarball shares the 0.20.3 version string but contains the
# upstream patches that the npm registry copy lacks (SheetJS pulled
# from npm in 2023; post-2023 patches are CDN-only). Verified by
# diffing the CDN tarball contents against the npm artifact that osv
# cites. Revisit on SheetJS version bump or if we migrate off xlsx.
#
# 2026-07-24 re-review (suppressions had expired, which correctly blocked
# a push): re-confirmed package.json line 81 and the lockfile both still
# resolve xlsx to https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz, so
# the CDN-tarball rationale still holds. Extended to 2026-10-24.
#
# 2026-10-22 re-review, ahead of that expiry: package.json:86 and the
# lockfile's node_modules/xlsx entry still resolve to the CDN tarball above
# (0.20.3). SheetJS's own advisories bound both CVEs: CVE-2023-30533 affects
# "SheetJS CE through 0.19.2" (fixed in 0.19.3) and CVE-2024-22363 "through
# 0.20.1" (fixed in 0.20.2), per cdn.sheetjs.com/advisories/<CVE>. OSV's npm
# entries list `introduced: 0` with no fix because the npm registry copy
# stopped at 0.18.5, so any version string matches. The CDN's latest is still
# 0.20.3 (cdn.sheetjs.com/xlsx-latest/package/package.json), so there is
# nothing newer to move to. Extended to 2027-01-22.

[[IgnoredVulns]]
id = "GHSA-4r6h-8v6p-xvw6"
ignoreUntil = 2027-01-22
reason = "Prototype pollution in SheetJS xlsx (CVE-2023-30533), fixed upstream in 0.19.3 per cdn.sheetjs.com/advisories/CVE-2023-30533. package.json:86 and the lockfile install xlsx 0.20.3 from the SheetJS CDN tarball; OSV matches the frozen npm registry package, which has no fixed version. Re-verified 2026-10-22."

[[IgnoredVulns]]
id = "GHSA-5pgg-2g8v-p4x9"
ignoreUntil = 2027-01-22
reason = "ReDoS in SheetJS xlsx (CVE-2024-22363), fixed upstream in 0.20.2 per cdn.sheetjs.com/advisories/CVE-2024-22363. Installed as 0.20.3 from the SheetJS CDN tarball (package.json:86, lockfile resolved URL), as GHSA-4r6h-8v6p-xvw6. Re-verified 2026-10-22."

# Removed 2026-10-24, the advisory itself withdrawn:
#   GHSA-vfj7-8cjw-p6xm (braces <=3.0.3, dev-only) -- OSV marks it withdrawn
#     2026-10-23, so osv-scanner no longer reports braces 3.0.3 and the entry
#     filtered nothing. braces 3.0.3 is still in the dev tree.

# Removed 2026-10-15, fixed instead of suppressed (path-scoped overrides in
# app/package.json, CLAUDE.md rule 53):
#   GHSA-hp3w-g68c-fv3c (sprintf-js) -- @istanbuljs/load-nyc-config now gets
#     js-yaml 4, which drops argparse 1 and with it sprintf-js. Its one call,
#     js-yaml.load(), has the same signature in 4 and only runs for a YAML
#     .nycrc, which this repo does not have.
#   GHSA-238p-pmpm-9mq7 (katex) -- micromark-extension-math now gets katex
#     0.18.x. markdownlint imports only its `math` tokenizer, never the KaTeX
#     renderer; lint:md output is identical before and after.

# Added 2026-10-27: GHSA-gcqx-w48m-w2h4, prototype poisoning in deepmerge's
# mergeObject() "through 4.3.1" (OSV: introduced 4.2.0, last_affected 4.3.1,
# no fixed version; npm's latest deepmerge is 4.3.1, so nothing to move to).
# It reaches the DEV tree only: jest -> @jest/core -> jest-config, which
# merges Jest's own defaults with this repo's jest.config.ts
# (node_modules/jest-config/build/index.js:943) and a preset's globals
# (:1442). Both inputs are developer-authored config files, never request or
# upload data, and nothing in src/ imports deepmerge. Re-check when jest is
# bumped or deepmerge publishes a fix.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-27
reason = "Prototype poisoning in deepmerge mergeObject() through 4.3.1; no fixed version exists (npm latest is 4.3.1). Dev-only: jest -> @jest/core -> jest-config, which merges Jest's defaults with jest.config.ts (jest-config/build/index.js:943) and preset globals (:1442), developer-authored config only; src/ never imports deepmerge. Verified 2026-10-27."
