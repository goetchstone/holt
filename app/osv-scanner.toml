# Fixed 2026-10-31 with version-scoped overrides in app/package.json (CLAUDE.md
# rule 53), not suppressed:
#   GHSA-mrwp-f3q8-3g9p (follow-redirects 1.16.1, runtime via axios) -- the
#     override floor moves to ^1.16.2, a patch release.
#   GHSA-3g3m-2fjr-6pw4 (glob 10.5.0 and 13.0.6, dev) -- "glob@10" and
#     "glob@13" now resolve to 14.0.3. Every consumer (jest-config, jest-runtime,
#     @jest/reporters, nyc, rimraf, test-exclude 7 and 8) calls only glob(),
#     glob.sync() or globSync() with cwd/nodir/dot/posix/ignore/
#     windowsPathsNoEscape; glob 14 drops the debug option and renames Pattern
#     internals, which none of them touch. glob 14 needs minimatch ^11, so the
#     old nested "glob" > "minimatch": "^10.2.5" override is gone.
#   GHSA-g3hv-75wg-m249 on the minimatch 10.x line (typescript-estree,
#     eslint-plugin-sonarjs, test-exclude) -- "minimatch@10" now resolves to
#     11.0.3. Those consumers call minimatch(), new Minimatch().match() and
#     hasMagic(); 11 removes makeRe(), .regexp, AST, matchOne() and debug,
#     none of which they use.
# On a clean `npm ci`, unit coverage instruments the same 366 files with
# identical statement, function and branch maps before and after. Hit counts
# move only in modules the fast-check fuzz suites reach, and they move as much
# between two runs of one tree.

