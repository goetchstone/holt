# markdownlint.yml -- Lint repo markdown for the rules we enforce
# (correctness + auto-fix-friendly formatting). Stylistic preferences
# (line length, inline HTML, table pipe spacing, multi-h1, etc) are
# disabled in `.markdownlint.json` -- see comment in that file for
# rationale and the incremental-tightening plan.
#
# Runs on every PR to main, the Monday weekly sweep and manual dispatch
# (no push trigger, no path filter). Fails fast and
# inline-annotates the offending line so PR reviewers see issues
# without downloading artifacts.
#
# Excludes whatever .gitignore excludes (`"gitignore": true` in
# `.markdownlint-cli2.jsonc`): node_modules, .next, coverage outputs,
# worktree scratch, and the private local planning docs. Here that is
# only app/node_modules, which `npm ci` below creates.
#
# markdownlint-cli2 is an exact-version devDependency in app/package.json,
# so this job runs the version and dependency tree app/package-lock.json
# pins, the same one `npm run lint:md` runs locally, and Dependabot bumps it
# like any other dependency. No path filter, so a PR that only bumps it
# runs this check.

name: Markdown lint

on:
  # 2026-05-13: dropped `push: branches: [main]` trigger to halve
  # Actions minute spend. The PR gate already validated the same
  # markdown; re-running on the squash commit is paranoia tax.
  # Runs on every PR to main (no path filter) so it can be a REQUIRED status
  # check; a path-filtered required check blocks PRs that don't touch its paths.
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:30 UTC, after Security weekly sweep
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # --ignore-scripts: this job needs one JS binary, so none of the app
      # tree's install scripts (prisma's engines, @parcel/watcher, ...) or its
      # git-hooks `prepare` run in a job holding a pull-requests: write token.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `lint:md` runs markdownlint-cli2 from the repo root, where it reads
      # `.markdownlint-cli2.jsonc` + `.markdownlint.json` automatically. It does
      # NOT read `.markdownlintignore` (unsupported per its README).
      - name: Run markdownlint-cli2
        run: npm run lint:md
