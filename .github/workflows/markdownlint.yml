# markdownlint.yml -- Lint repo markdown for the rules we enforce
# (correctness + auto-fix-friendly formatting). Stylistic preferences
# (line length, inline HTML, table pipe spacing, multi-h1, etc) are
# disabled in `.markdownlint.json` -- see comment in that file for
# rationale and the incremental-tightening plan.
#
# Runs on every PR to main, the Monday weekly sweep and manual dispatch
# (no push trigger, no path filter). Fails fast and
# inline-annotates the offending line so PR reviewers see issues
# without downloading artifacts.
#
# Excludes whatever .gitignore excludes (`"gitignore": true` in
# `.markdownlint-cli2.jsonc`): node_modules, .next, coverage outputs,
# worktree scratch, and the private local planning docs. A checkout
# holds none of those, so here this only matters for local runs.

name: Markdown lint

on:
  # 2026-05-13: dropped `push: branches: [main]` trigger to halve
  # Actions minute spend. The PR gate already validated the same
  # markdown; re-running on the squash commit is paranoia tax.
  # Runs on every PR to main (no path filter) so it can be a REQUIRED status
  # check; a path-filtered required check blocks PRs that don't touch its paths.
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:30 UTC, after Security weekly sweep
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # markdownlint-cli2 reads `.markdownlint-cli2.jsonc` + `.markdownlint.json`
      # at repo root automatically. It does NOT read `.markdownlintignore`
      # (unsupported per its README). The negation glob `!**/node_modules/**`
      # is kept so the command matches `npm run lint:md` exactly.
      - name: Run markdownlint-cli2
        run: |
          npx --yes markdownlint-cli2 "**/*.md" "!**/node_modules/**"
