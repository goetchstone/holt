name: Bug report
description: Something is broken or does not work as the screen or the docs say
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Two things first:

        - **Security problems do not go here.** Report them privately: see [SECURITY.md](https://github.com/goetchstone/holt/blob/main/SECURITY.md).
        - **This tracker is public.** Leave out real customer names, addresses, card or bank details, and passwords or keys. Blur them in screenshots.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Holt is affected?
      options:
        - Sales / POS
        - Quotes / Orders
        - Inventory / Warehouse
        - Purchasing / Receiving
        - Service / Dispatch / Delivery
        - Returns
        - Reports
        - Pricing / Price-book import
        - Products / Catalog
        - Customers
        - Storefront / CMS
        - Admin / Setup / Roles
        - Printing (receipts, labels)
        - Sign-in / Access
        - Install / Upgrade / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: The steps you took, what you expected, and what happened instead.
      placeholder: |
        1. I went to ...
        2. I clicked ...
        3. Expected: ...
        4. Instead: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit or release you run (`git rev-parse --short HEAD` in the checkout), or "the demo seed on main".
      placeholder: 9ddffeee
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How Holt is run
      options:
        - Docker Compose
        - "npm run dev on my machine"
        - Other (say how below)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPad Pro, Safari 19 / Windows laptop, Chrome 142
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot, error message or log
      description: The message on the screen, a screenshot, or the app log lines from that moment. Drag and drop works.
    validations:
      required: false
  - type: input
    id: url
    attributes:
      label: Page
      description: The path of the page, without your domain if you would rather not share it.
      placeholder: /app/sales/orders
    validations:
      required: false
