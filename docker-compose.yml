# docker-compose.yml
#
# Holt -- Business Management System
#
# Usage:
#   Production (default):      docker compose up -d --build
#   Development (hot-reload):  docker compose --profile dev up
#   Staging:                   docker compose --profile staging up -d --build
#   Practice copy:             docker compose --profile practice up -d --build
#                              (see docs/domains/practice-copy.md)
#   Database only:             docker compose up db

# Project name pinned so containers/volumes stay "holt-*" regardless of the
# directory the repo is cloned into.
name: holt

# The production image's build, shared by the migrate and app services so both
# always run the same code (YAML anchor, used as `build: *app-build`).
x-app-build: &app-build
  context: ./app
  dockerfile: Dockerfile
  args:
    GIT_COMMIT: "${GIT_COMMIT:-unknown}"

services:

  # --------------------------------------------------------------------------
  # PostgreSQL database (always available, no profile needed)
  # --------------------------------------------------------------------------
  db:
    image: postgres:17.9-alpine
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only: the database must not be reachable from the network.
      # Remote access goes through an SSH tunnel (ssh -L 5433:127.0.0.1:5433).
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Next.js application -- Development mode (hot-reload)
  # Run with: docker compose --profile dev up
  # --------------------------------------------------------------------------
  app-dev:
    image: node:24-alpine
    pull_policy: always
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
      - uploads:/app/data/uploads
      # Writable here (not :ro) so the dev flow can edit presets in place.
      - ./config:/etc/holt/config
    command: >
      sh -c "apk add --no-cache poppler-utils postgresql-client &&
             npm install &&
             npx prisma generate &&
             npx next dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HOLT_CONFIG_DIR=/etc/holt/config
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Migrations -- one container, run to completion before any app process starts.
  #
  # Every app process used to migrate at boot (docker-entrypoint.sh), so with
  # several processes they all raced for Prisma's migration lock, and a long
  # migration timed the losers out. Now this one-shot service migrates, once per
  # `docker compose up`, and `app` waits for it to finish successfully
  # (depends_on below). Every way of starting the stack still migrates: a fresh
  # `up`, scripts/deploy.sh (which runs this service itself before the swap) and
  # scripts/restore-db.sh (whose `up app` starts it first). A failed migration
  # stops `app` from starting, as the entrypoint's refusal did.
  # --------------------------------------------------------------------------
  migrate:
    build: *app-build
    restart: "no"
    env_file:
      - .env
      - app/.env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      # This container IS the migration; the entrypoint's own step is skipped.
      - RUN_MIGRATIONS=false
    # The image has no npx (see app/Dockerfile), so the CLI is called by path.
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Next.js application -- Production mode (built image)
  # Starts by default with: docker compose up
  #
  # Runs as APP_REPLICAS identical processes (default 1) behind nginx, which
  # spreads requests across them. They share the database and the uploads
  # volume and nothing else; what that means, and how to size it, is in
  # docs/HOSTING.md. `scale` lives here rather than on the command line so every
  # `up` (deploy.sh, restore-db.sh) keeps the count.
  #
  # No host port: with more than one process there is no single process to
  # publish, and a fixed "3000:3000" stops a second one starting at all. Browsers
  # reach the app through nginx on 80/443; the host's own jobs (cron, deploy's
  # health gate, restore) reach it through nginx-host on 127.0.0.1:8080.
  # --------------------------------------------------------------------------
  app:
    build: *app-build
    restart: unless-stopped
    scale: ${APP_REPLICAS:-1}
    env_file:
      - .env
      - app/.env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      # Without this, resolveConfigRoot() looks at /app/../config = /config,
      # which does not exist in the image, and every preset silently resolves
      # to nothing.
      - HOLT_CONFIG_DIR=/etc/holt/config
      # The migrate service above has already migrated; a process does not.
      - RUN_MIGRATIONS=false
      # Database connections EACH process may open (lib/prisma.ts). Keep
      # APP_REPLICAS x PG_POOL_MAX under Postgres's max_connections (100 by
      # default) with room to spare for backups, migrations and psql.
      - PG_POOL_MAX=${PG_POOL_MAX:-10}
      # The app is reached only through nginx (no published port), so the
      # client address comes from the proxy's header; without this every
      # client shares nginx's rate-limit bucket (lib/rateLimit.ts).
      - TRUST_PROXY=true
    volumes:
      - uploads:/app/data/uploads
      - ./config/service-account.json:/app/config/service-account.json:ro
      # Config presets. Mounted rather than baked into the image for two
      # reasons: the build context is ./app, so repo-root config/ is not
      # reachable by a COPY at all; and changing a mapping should not require
      # an image rebuild -- that is the whole point of config-as-data.
      # Read-only: the app reads presets and writes rows, never files. The
      # GUI's export is a download, not a disk write.
      # See docs/domains/config-presets.md.
      - ./config:/etc/holt/config:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Liveness probe: the container is unhealthy if /api/health stops
    # answering (DB unreachable -> 503). start_period covers cold boot +
    # Prisma client warm-up; bump to 60s on slow NAS storage. It asks the
    # process inside its own container, so each process is checked on its own.
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Give in-flight requests (long imports) time to drain on restart/deploy.
    stop_grace_period: 30s

  # --------------------------------------------------------------------------
  # Nginx reverse proxy (production)
  # Starts by default with: docker compose up
  #
  # Ports changed from the old "8080:80"-only mapping to standard 80/443 as
  # part of adding TLS (docs/PRODUCTION.md section 2): Let's Encrypt's
  # HTTP-01 challenge always validates against the real port 80, and
  # browsers assume 443 for https:// with no port in the URL. If a router
  # or NAT rule forwarded an external port to the old host 8080, repoint it
  # at host 80 and 443 instead.
  #
  # The host's own jobs do not come through here but through nginx-host below,
  # so that this server's TLS certificate is never something they depend on.
  #
  # The tag is exact: 1.27.3 is the first open-source nginx that re-resolves an
  # upstream's name while running (`server app:3000 resolve`), which is how it
  # finds app processes added by APP_REPLICAS. 1.30 is the current stable line.
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.30.5-alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app-upstream.conf:/etc/nginx/app-upstream.conf:ro
      # Populated by scripts/init-letsencrypt.sh; nginx only ever reads them.
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app

  # --------------------------------------------------------------------------
  # The host's own way in: a second, small nginx, published on the server's
  # loopback only (127.0.0.1:8080), never reachable from another machine. The
  # jobs that run on the host itself use it -- scripts/_cron-run.sh (the
  # automations tick), deploy.sh's health gate, restore-db.sh, go-live-check.sh:
  # plain HTTP, long timeouts, no redirect to HTTPS.
  #
  # A separate container, not a server block in nginx.conf, because nginx will
  # not start at all when a certificate the config names is missing. As one
  # process, a missing or broken certificate (before init-letsencrypt.sh, on a
  # tunnelled install without one, a typo in nginx.conf) took cron, the deploy
  # gate and restore down with the site. This one has no certificate and no
  # domain, and its file (nginx/nginx-host.conf) is never edited by hand.
  # --------------------------------------------------------------------------
  nginx-host:
    image: nginx:1.30.5-alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx-host.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/app-upstream.conf:/etc/nginx/app-upstream.conf:ro
    depends_on:
      - app

  # --------------------------------------------------------------------------
  # Certbot (Let's Encrypt client) -- issues and renews the TLS cert nginx
  # uses above. Not part of the default `docker compose up` (profile "tls"
  # keeps it out of the way day-to-day); scripts/init-letsencrypt.sh invokes
  # it explicitly for both first issuance and renewal. See
  # docs/PRODUCTION.md section 2.
  # --------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:v5.7.0
    pull_policy: always
    profiles: ["tls"]
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  # --------------------------------------------------------------------------
  # Staging database (separate volume from production)
  # Run with: docker compose --profile staging up -d --build
  # --------------------------------------------------------------------------
  db-staging:
    image: postgres:17.9-alpine
    pull_policy: always
    profiles: ["staging"]
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:-dbuser_fbc_staging}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:-staging}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-fbc_staging_db}
    ports:
      # Loopback only, as for db above; use an SSH tunnel for remote access.
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-dbuser_fbc_staging} -d ${STAGING_POSTGRES_DB:-fbc_staging_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Next.js application -- Staging mode (built image, separate DB)
  # --------------------------------------------------------------------------
  app-staging:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    profiles: ["staging"]
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.staging
      - app/.env.staging.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${STAGING_POSTGRES_USER:-dbuser_fbc_staging}:${STAGING_POSTGRES_PASSWORD:-staging}@db-staging:5432/${STAGING_POSTGRES_DB:-fbc_staging_db}
    volumes:
      - uploads-staging:/app/data/uploads
      - ./config/service-account.json:/app/config/service-account.json:ro
    depends_on:
      db-staging:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Nginx reverse proxy (staging)
  # --------------------------------------------------------------------------
  nginx-staging:
    image: nginx:1.30.5-alpine
    pull_policy: always
    profiles: ["staging"]
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx-staging.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-staging

  # --------------------------------------------------------------------------
  # Practice copy (GAP-28): the same app on its own database in the same Postgres,
  # where staff learn the system and nothing is real. Its database's NAME is what
  # makes it practice (lib/practiceCopy.ts). Setup: docs/domains/practice-copy.md.
  #
  # NEXTAUTH_SECRET is its own on purpose. A session signed here must not be valid
  # on the live app, since anyone may be an admin here. Left unset, the secret is
  # empty, the app logs "Refusing to start" (lib/validateEnv.ts) and every page
  # answers 500, though the container stays up.
  # --------------------------------------------------------------------------
  app-practice:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
    profiles: ["practice"]
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
      - app/.env.local
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${PRACTICE_POSTGRES_DB:-holt_demo_practice}
      - NEXTAUTH_URL=${PRACTICE_NEXTAUTH_URL:-}
      - NEXTAUTH_SECRET=${PRACTICE_NEXTAUTH_SECRET:-}
      - AUTH_LOCAL_ENABLED=true
      - HOLT_CONFIG_DIR=/etc/holt/config
    volumes:
      - uploads-practice:/app/data/uploads
      - ./config:/etc/holt/config:ro
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # One-off: load the demo seed into the practice copy's database. The built image
  # ships no seed scripts (app/Dockerfile), so this runs from the checkout, like
  # app-dev. Run with: docker compose --profile practice-seed run --rm practice-seed
  # --------------------------------------------------------------------------
  practice-seed:
    image: node:24-alpine
    pull_policy: always
    profiles: ["practice-seed"]
    working_dir: /app
    volumes:
      - ./app:/app
      - app_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${PRACTICE_POSTGRES_DB:-holt_demo_practice}
      - PRACTICE_STAFF_PASSWORD=${PRACTICE_STAFF_PASSWORD:-}
    command: >
      sh -c "npm ci &&
             npx prisma generate &&
             npx prisma migrate deploy &&
             npm run seed:all"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgdata-staging:
  app_node_modules:
  uploads:
  uploads-staging:
  uploads-practice:
  # TLS cert (certbot's /etc/letsencrypt) and ACME webroot, shared between
  # the nginx and certbot services. No secrets in the repo -- these are
  # empty until scripts/init-letsencrypt.sh populates them at deploy time.
  certbot-etc:
  certbot-webroot:
